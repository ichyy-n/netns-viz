<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="link" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#3a7bd5"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="nodeGlow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>

  <!-- Network links -->
  <g stroke="url(#link)" stroke-width="8" stroke-linecap="round" opacity="0.7" filter="url(#glow)">
    <!-- Top to center -->
    <line x1="512" y1="230" x2="300" y2="480"/>
    <line x1="512" y1="230" x2="724" y2="480"/>
    <!-- Center left to bottom -->
    <line x1="300" y1="480" x2="380" y2="750"/>
    <!-- Center right to bottom -->
    <line x1="724" y1="480" x2="644" y2="750"/>
    <!-- Cross link -->
    <line x1="300" y1="480" x2="724" y2="480"/>
    <!-- Bottom link -->
    <line x1="380" y1="750" x2="644" y2="750"/>
  </g>

  <!-- Network nodes (namespace boxes) -->
  <g filter="url(#nodeGlow)">
    <!-- Top node -->
    <rect x="452" y="170" width="120" height="120" rx="24" fill="#0f3460" stroke="#00d2ff" stroke-width="5"/>
    <text x="512" y="243" text-anchor="middle" fill="#e0e0e0" font-family="monospace" font-size="42" font-weight="bold">ns0</text>

    <!-- Center-left node -->
    <rect x="240" y="420" width="120" height="120" rx="24" fill="#0f3460" stroke="#00d2ff" stroke-width="5"/>
    <text x="300" y="493" text-anchor="middle" fill="#e0e0e0" font-family="monospace" font-size="42" font-weight="bold">ns1</text>

    <!-- Center-right node -->
    <rect x="664" y="420" width="120" height="120" rx="24" fill="#0f3460" stroke="#00d2ff" stroke-width="5"/>
    <text x="724" y="493" text-anchor="middle" fill="#e0e0e0" font-family="monospace" font-size="42" font-weight="bold">ns2</text>

    <!-- Bottom-left node -->
    <rect x="320" y="690" width="120" height="120" rx="24" fill="#0f3460" stroke="#00d2ff" stroke-width="5"/>
    <text x="380" y="763" text-anchor="middle" fill="#e0e0e0" font-family="monospace" font-size="42" font-weight="bold">ns3</text>

    <!-- Bottom-right node -->
    <rect x="584" y="690" width="120" height="120" rx="24" fill="#0f3460" stroke="#00d2ff" stroke-width="5"/>
    <text x="644" y="763" text-anchor="middle" fill="#e0e0e0" font-family="monospace" font-size="42" font-weight="bold">ns4</text>
  </g>

  <!-- Small decorative dots on links (representing interfaces) -->
  <g fill="#00d2ff" opacity="0.9">
    <circle cx="406" cy="355" r="8"/>
    <circle cx="618" cy="355" r="8"/>
    <circle cx="512" cy="480" r="8"/>
    <circle cx="340" cy="615" r="8"/>
    <circle cx="684" cy="615" r="8"/>
    <circle cx="512" cy="750" r="8"/>
  </g>
</svg>
