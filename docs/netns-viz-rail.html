// Topology diagram — shared canvas visualization used inside each variation
// Renders the ch01 VLAN topology as an SVG.
//
// Props: { width, height, variant, lang }
//   variant: 'orbit' | 'rail' | 'shell' — subtle styling differences
//   lang: 'jp' | 'en'

const NS_W = 200;
const NS_H_SWITCH = 110;
const NS_H_HOST = 94;

function NodeCoords(n) {
  // Center of the node
  const h = n.role === 'switch' ? NS_H_SWITCH : NS_H_HOST;
  return { cx: n.x + NS_W / 2, cy: n.y + h / 2, w: NS_W, h };
}

function PortAnchor(n, side) {
  const { cx, cy, w, h } = NodeCoords(n);
  const hw = w / 2, hh = h / 2;
  switch (side) {
    case 't':  return { x: cx,          y: cy - hh };
    case 'b':  return { x: cx,          y: cy + hh };
    case 'l':  return { x: cx - hw,     y: cy };
    case 'r':  return { x: cx + hw,     y: cy };
    case 'bl': return { x: cx - hw/2,   y: cy + hh };
    case 'br': return { x: cx + hw/2,   y: cy + hh };
    case 'tl': return { x: cx - hw/2,   y: cy - hh };
    case 'tr': return { x: cx + hw/2,   y: cy - hh };
    default:   return { x: cx,          y: cy };
  }
}

function vlanColor(vid) {
  if (vid === 10) return TOKENS.vlan10;
  if (vid === 20) return TOKENS.vlan20;
  return TOKENS.textMid;
}

function LinkPath({ a, b, stroke, dashed, highlighted }) {
  // Smooth bezier — horizontal pull for trunks, vertical for access
  const dx = b.x - a.x, dy = b.y - a.y;
  const horizontal = Math.abs(dx) > Math.abs(dy);
  const c = horizontal
    ? `M${a.x},${a.y} C${a.x + dx * 0.4},${a.y} ${b.x - dx * 0.4},${b.y} ${b.x},${b.y}`
    : `M${a.x},${a.y} C${a.x},${a.y + dy * 0.45} ${b.x},${b.y - dy * 0.45} ${b.x},${b.y}`;
  return (
    <path
      d={c}
      stroke={stroke}
      strokeWidth={highlighted ? 2.5 : 1.6}
      fill="none"
      strokeDasharray={dashed ? '5 4' : 'none'}
      strokeLinecap="round"
      opacity={highlighted ? 1 : 0.85}
    />
  );
}

function NodeCard({ n, selected, showPorts, variant, L }) {

  const isSwitch = n.role === 'switch';
  const vlanAccent = isSwitch ? TOKENS.magenta : vlanColor(n.vlan);

      {/* soft shadow */}
      <rect x={0} y={3} width={w} height={h} rx={10}
        fill="rgba(0,0,0,0.35)" filter="blur(6px)" opacity={0.5} />
      {/* body */}
      <rect x={0} y={0} width={w} height={h} rx={10}
        fill={TOKENS.surface2}
        stroke={selected ? vlanAccent : TOKENS.line}
        strokeWidth={selected ? 1.5 : 1} />
      {/* header strip */}
      <rect x={0} y={0} width={w} height={32} rx={10}
        fill={isSwitch ? 'rgba(217,104,199,0.08)' : (n.vlan === 10 ? TOKENS.vlan10Soft : TOKENS.vlan20Soft)} />
      <rect x={0} y={22} width={w} height={10}
        fill={isSwitch ? 'rgba(217,104,199,0.08)' : (n.vlan === 10 ? TOKENS.vlan10Soft : TOKENS.vlan20Soft)} />
      <line x1={0} y1={32} x2={w} y2={32} stroke={TOKENS.line} strokeWidth={0.5} />

      {/* icon pill */}
      <circle cx={18} cy={16} r={9} fill={vlanAccent + '28'} />
      <g transform="translate(10,8)" style={{ color: vlanAccent }}>
        <IconStroke d={icon} size={16} />
      </g>

      {/* name */}
      <text x={34} y={20} fill={TOKENS.text} fontSize={13} fontWeight={600}
        fontFamily={TOKENS.fontMono} letterSpacing="-0.01em">{n.name}</text>

      {/* role tag */}
      <text x={w - 10} y={20} textAnchor="end" fill={TOKENS.textDim}
        fontSize={9.5} fontFamily={TOKENS.fontMono} letterSpacing="0.08em">
        {isSwitch ? 'L2' : `VLAN ${n.vlan}`}
      </text>

      {/* body content */}
      {isSwitch ? (
        <g>
          <text x={14} y={52} fill={TOKENS.textMid} fontSize={10.5}
            fontFamily={TOKENS.fontMono} letterSpacing="0.06em">br0 · vlan_filtering 1</text>
          <text x={14} y={70} fill={TOKENS.textDim} fontSize={10}
            fontFamily={TOKENS.fontMono}>3 ports · 2 VLANs</text>
          {/* port dots */}
          <g transform={`translate(14,82)`}>
            {[10, 10, 'T'].map((v, i) => (
              <g key={i} transform={`translate(${i * 22},0)`}>
                <rect x={0} y={0} width={18} height={18} rx={4}
                  fill={v === 'T' ? TOKENS.trunkSoft : (v === 10 ? TOKENS.vlan10Soft : TOKENS.vlan20Soft)}
                  stroke={v === 'T' ? TOKENS.trunk : (v === 10 ? TOKENS.vlan10 : TOKENS.vlan20)}
                  strokeWidth={0.75} strokeOpacity={0.5} />
                <text x={9} y={13} textAnchor="middle"
                  fill={v === 'T' ? TOKENS.trunk : (v === 10 ? TOKENS.vlan10 : TOKENS.vlan20)}
                  fontSize={9} fontFamily={TOKENS.fontMono} fontWeight={600}>
                  {v === 'T' ? 'T' : v}
                </text>
              </g>
            ))}
          </g>
        </g>
      ) : (
        <g>
          <text x={14} y={52} fill={TOKENS.text} fontSize={11}
            fontFamily={TOKENS.fontMono}>{n.ip}</text>
          <text x={14} y={68} fill={TOKENS.textDim} fontSize={9.5}
            fontFamily={TOKENS.fontMono} letterSpacing="0.06em">veth-{n.name} · UP</text>
          {/* vlan pill */}
          <rect x={14} y={76} width={56} height={14} rx={3}
            fill={n.vlan === 10 ? TOKENS.vlan10Soft : TOKENS.vlan20Soft}
            stroke={n.vlan === 10 ? TOKENS.vlan10 : TOKENS.vlan20}
            strokeOpacity={0.4} strokeWidth={0.75} />
          <text x={42} y={86} textAnchor="middle"
            fill={n.vlan === 10 ? TOKENS.vlan10 : TOKENS.vlan20}
            fontSize={9} fontFamily={TOKENS.fontMono} fontWeight={600} letterSpacing="0.08em">
            VLAN {n.vlan}
          </text>
        </g>
      )}

      {/* corner status dot */}
      <circle cx={w - 14} cy={h - 12} r={3} fill={TOKENS.green} opacity={0.85} />
    </g>

}

function TopologyDiagram({ width, height, variant = 'orbit', lang = 'en', showLegend = true, selectedId = 'sw1', tx = 0, ty = 0, scale = 1 }) {
  const L = LABELS[lang];

  // Build anchors
  const nsById = {};
  CH01.namespaces.forEach(n => nsById[n.id] = n);

  // Compute link endpoints
  const links = CH01.links.map(l => {
    const a = PortAnchor(nsById[l.a.ns], l.a.side);
    const b = PortAnchor(nsById[l.b.ns], l.b.side);
    return { ...l, pa: a, pb: b };
  });

  return (
    <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`} style={{ display: 'block' }}>
      <defs>
        <pattern id={`grid-${variant}`} width="32" height="32" patternUnits="userSpaceOnUse">
          <circle cx={1} cy={1} r={0.7} fill={TOKENS.textFaint} opacity={0.55} />
        </pattern>
        <radialGradient id={`spot-${variant}`} cx="50%" cy="30%" r="60%">
          <stop offset="0%" stopColor={TOKENS.indigo} stopOpacity={0.08} />
          <stop offset="100%" stopColor={TOKENS.indigo} stopOpacity={0} />
        </radialGradient>
      </defs>

      <rect width={width} height={height} fill={TOKENS.bg} />

// ─── helpers ─────────────────────────────────────────────────────────────

const RailCtx = React.createContext(null);
const useRail = () => React.useContext(RailCtx);

function useHover() {
  const [h, setH] = React.useState(false);
  return [h, { onMouseEnter: () => setH(true), onMouseLeave: () => setH(false) }];
}

function Chip({ children, color, soft, size = 'sm', style }) {
  const pad = size === 'sm' ? '2px 6px' : '3px 8px';
  const fs = size === 'sm' ? 9.5 : 10.5;
  return (
    <span style={{
      display: 'inline-flex', alignItems: 'center', gap: 4,
      padding: pad, fontSize: fs, fontFamily: TOKENS.fontMono,
      fontWeight: 600, letterSpacing: '0.05em',
      background: soft, color, borderRadius: 3, ...style,
    }}>{children}</span>
  );
}

function Dot({ color, size = 6, style }) {
  return <span style={{ width: size, height: size, borderRadius: size/2, background: color, display: 'inline-block', ...style }} />;
}

// Build port map per switch from CH01.links — used in table/inspector
function buildPortMap() {
  const map = { sw1: [], sw2: [] };
  CH01.links.forEach(l => {
    [l.a, l.b].forEach(end => {
      if (end.ns === 'sw1' || end.ns === 'sw2') {
        if (l.kind === 'trunk') {
          [10, 20].forEach(vid => map[end.ns].push({ port: end.port, vid, flags: 'tagged', kind: 'trunk', linkId: l.id }));
        } else {
          map[end.ns].push({ port: end.port, vid: l.vlan, flags: 'PVID · untagged', kind: 'access', linkId: l.id });
        }
      }
    });
  });
  return map;
}

// ─── interactive topology canvas ────────────────────────────────────────

function InteractiveTopology() {
  const { selectedId, setSelected, hoverId, setHover, lang } = useRail();
  const [pan, setPan] = React.useState({ x: 0, y: 0 });
  const [zoom, setZoom] = React.useState(1);
  const [contextMenu, setCtx] = React.useState(null); // {x, y, id}
  const [pingAnim, setPingAnim] = React.useState(null); // linkId being animated
  const dragRef = React.useRef(null);

  const nsById = {};
  CH01.namespaces.forEach(n => nsById[n.id] = n);

  const onBgMouseDown = (e) => {
    if (e.target.closest('[data-node]')) return;
    setCtx(null); setSelected(null);
    dragRef.current = { sx: e.clientX, sy: e.clientY, px: pan.x, py: pan.y };
  };
  const onMouseMove = (e) => {
    if (!dragRef.current) return;
    setPan({ x: dragRef.current.px + (e.clientX - dragRef.current.sx),
             y: dragRef.current.py + (e.clientY - dragRef.current.sy) });
  };
  const onMouseUp = () => { dragRef.current = null; };
  const onWheel = (e) => {
    e.preventDefault();
    if (e.ctrlKey || e.metaKey) {
      setZoom(z => Math.max(0.5, Math.min(2, z * (1 - e.deltaY * 0.002))));
    } else {
      setPan(p => ({ x: p.x - e.deltaX, y: p.y - e.deltaY }));
    }
  };

  // compute link endpoints
  const links = CH01.links.map(l => {
    const a = PortAnchor(nsById[l.a.ns], l.a.side);
    const b = PortAnchor(nsById[l.b.ns], l.b.side);
    return { ...l, pa: a, pb: b };
  });

  const isLinkHot = (l) => {
    if (!selectedId && !hoverId) return false;
    const id = selectedId || hoverId;
    return l.a.ns === id || l.b.ns === id;
  };
  const isNodeDim = (n) => selectedId && selectedId !== n.id && !links.some(l => (l.a.ns === selectedId && l.b.ns === n.id) || (l.b.ns === selectedId && l.a.ns === n.id));

  // Bounds for canvas
  const VW = 1240, VH = 720;

  return (
    <div
      onMouseMove={onMouseMove}
      onMouseUp={onMouseUp}
      onMouseLeave={onMouseUp}
      onWheel={onWheel}
      onMouseDown={onBgMouseDown}
      style={{ flex: 1, position: 'relative', background: TOKENS.bg, overflow: 'hidden', cursor: dragRef.current ? 'grabbing' : 'default' }}
    >
      <svg width="100%" height="100%" viewBox={`0 0 ${VW} ${VH}`} preserveAspectRatio="xMidYMid meet"
        style={{ position: 'absolute', inset: 0, userSelect: 'none' }}>
        <defs>
          <pattern id="dot-grid" width="28" height="28" patternUnits="userSpaceOnUse">
            <circle cx={1} cy={1} r={0.7} fill={TOKENS.textFaint} opacity={0.55} />
          </pattern>
          <radialGradient id="canvas-spot" cx="50%" cy="30%" r="60%">
            <stop offset="0%" stopColor={TOKENS.indigo} stopOpacity={0.08} />
            <stop offset="100%" stopColor={TOKENS.indigo} stopOpacity={0} />
          </radialGradient>
          <filter id="node-shadow"><feDropShadow dx="0" dy="4" stdDeviation="8" floodColor="#000" floodOpacity="0.5" /></filter>
        </defs>

        <rect width={VW} height={VH} fill={TOKENS.bg} />
        <rect width={VW} height={VH} fill="url(#dot-grid)" />
        <rect width={VW} height={VH} fill="url(#canvas-spot)" />

        <g transform={`translate(${pan.x},${pan.y}) scale(${zoom})`}>
          {/* VLAN territories */}
          <g opacity={0.55}>
            <ellipse cx={280} cy={480} rx={270} ry={135} fill={TOKENS.vlan10Soft} />
            <text x={280} y={635} textAnchor="middle" fill={TOKENS.vlan10} fontSize={10}
              fontFamily={TOKENS.fontMono} letterSpacing="0.2em" opacity={0.7}>VLAN 10 · 192.168.10.0/24</text>
            <ellipse cx={960} cy={480} rx={270} ry={135} fill={TOKENS.vlan20Soft} />
            <text x={960} y={635} textAnchor="middle" fill={TOKENS.vlan20} fontSize={10}
              fontFamily={TOKENS.fontMono} letterSpacing="0.2em" opacity={0.7}>VLAN 20 · 192.168.20.0/24</text>
          </g>

          {/* Links */}
          {links.map(l => {
            const hot = isLinkHot(l);
            const color = l.kind === 'trunk' ? TOKENS.trunk : vlanColor(l.vlan);
            const animating = pingAnim === l.id;
            return (
              <g key={l.id} opacity={selectedId && !hot ? 0.3 : 1} style={{ transition: 'opacity .15s' }}>
                <LinkPath a={l.pa} b={l.pb} stroke={color} dashed={l.kind === 'trunk'} highlighted={hot} />
                <circle cx={l.pa.x} cy={l.pa.y} r={3} fill={color} />
                <circle cx={l.pb.x} cy={l.pb.y} r={3} fill={color} />
                {animating && (
                  <circle r={4} fill={color}>
                    <animateMotion dur="1.2s" repeatCount="2"
                      path={`M${l.pa.x - l.pa.x},${l.pa.y - l.pa.y} L${l.pb.x - l.pa.x},${l.pb.y - l.pa.y}`} />
                  </circle>

                {l.kind === 'trunk' && (() => {

function ContextMenu({ x, y, id, onClose, onPing }) {
  const { lang } = useRail();
  const items = [
    { icon: ICONS.eye, label: lang === 'jp' ? 'インスペクタで開く' : 'Open in inspector' },
    { icon: ICONS.terminal, label: lang === 'jp' ? 'シェルを起動' : 'Open shell', mono: `nsenter -t ${id}` },
    { icon: ICONS.bolt, label: lang === 'jp' ? 'ping を送信' : 'Send ping', onClick: onPing },
    { icon: ICONS.link, label: lang === 'jp' ? 'リンクを追加…' : 'Attach link…' },
    { icon: ICONS.vlan, label: lang === 'jp' ? 'VLAN を設定…' : 'Set VLAN…' },
    'sep',
    { icon: ICONS.close, label: lang === 'jp' ? '削除' : 'Delete', danger: true },
  ];
  React.useEffect(() => {
    const h = () => onClose();
    window.addEventListener('click', h);
    return () => window.removeEventListener('click', h);
  }, []);
  return (
    <div style={{ position: 'fixed', left: x, top: y, zIndex: 100,
      background: TOKENS.surface, border: `1px solid ${TOKENS.line}`, borderRadius: 8,
      padding: 4, minWidth: 220, boxShadow: '0 10px 40px rgba(0,0,0,0.5)',
      fontFamily: TOKENS.fontSans }}>
      {items.map((it, i) => it === 'sep' ? (
        <div key={i} style={{ height: 1, background: TOKENS.line, margin: '4px 0' }} />
      ) : (
        <div key={i} onClick={(e) => { e.stopPropagation(); it.onClick && it.onClick(); onClose(); }}
          style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '6px 10px',
            borderRadius: 4, cursor: 'pointer', fontSize: 12,
            color: it.danger ? TOKENS.red : TOKENS.text }}
          onMouseEnter={(e) => e.currentTarget.style.background = it.danger ? TOKENS.redSoft : TOKENS.surfaceHi}
          onMouseLeave={(e) => e.currentTarget.style.background = 'transparent'}>
          <IconStroke d={it.icon} size={12} color={it.danger ? TOKENS.red : TOKENS.textMid} />
          <span style={{ flex: 1 }}>{it.label}</span>
          {it.mono && <span style={{ fontSize: 10, fontFamily: TOKENS.fontMono, color: TOKENS.textFaint }}>{it.mono}</span>}

    </div>
  );
}

// ─── Table view (VLAN port matrix — the killer feature of B) ─────────────

function TableView() {
  const { lang, L, portEdits, setPortEdits } = useRail();
  const portMap = buildPortMap();
  const [editing, setEditing] = React.useState(null); // {ns, port, vid, field}

  const Row = ({ nsId, entry }) => {
    const key = `${nsId}::${entry.port}::${entry.vid}`;
    const edited = portEdits[key];
    const curVid = edited?.vid ?? entry.vid;
    const curFlags = edited?.flags ?? entry.flags;
    const isEditing = editing?.key === key;

    return (
      <div style={{ display: 'grid', gridTemplateColumns: '60px 160px 80px 100px 1fr 60px',
        alignItems: 'center', padding: '10px 14px', fontSize: 11.5, fontFamily: TOKENS.fontMono,
        borderBottom: `1px solid ${TOKENS.lineSoft}`,
        background: edited ? TOKENS.indigoSoft : 'transparent' }}
        onMouseEnter={e => { if (!edited) e.currentTarget.style.background = TOKENS.lineSoft; }}
        onMouseLeave={e => { if (!edited) e.currentTarget.style.background = 'transparent'; }}>
        <span style={{ color: TOKENS.magenta, fontWeight: 600 }}>{nsId}</span>
        <span style={{ color: TOKENS.text }}>{entry.port}</span>
        <span>
          {isEditing && editing.field === 'vid' ? (
            <input autoFocus type="number" defaultValue={curVid}
              onBlur={(e) => { setPortEdits({...portEdits, [key]: { ...edited, vid: parseInt(e.target.value) || curVid }}); setEditing(null); }}
              onKeyDown={(e) => { if (e.key === 'Enter') e.target.blur(); if (e.key === 'Escape') setEditing(null); }}
              style={{ width: 50, background: TOKENS.bg, border: `1px solid ${TOKENS.indigo}`,
                color: TOKENS.text, fontFamily: TOKENS.fontMono, fontSize: 11.5, padding: '2px 6px', borderRadius: 3 }} />
          ) : (
            <span onDoubleClick={() => setEditing({ key, field: 'vid' })}
              style={{ cursor: 'text' }}>
              <Chip color={vlanColor(curVid)} soft={curVid === 10 ? TOKENS.vlan10Soft : TOKENS.vlan20Soft}>{curVid}</Chip>
            </span>
          )}
        </span>
        <span style={{ color: TOKENS.textMid, fontSize: 10.5 }}>{entry.kind}</span>
        <span style={{ color: TOKENS.textDim, fontSize: 10.5 }}>{curFlags}</span>
        <span>
          {edited && <Chip color={TOKENS.indigo} soft={TOKENS.indigoSoft}>DIRTY</Chip>}
        </span>
      </div>
    );
  };

  return (
    <div style={{ flex: 1, overflow: 'auto', padding: '14px 18px', background: TOKENS.bg }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 10 }}>
        <div style={{ fontSize: 12, color: TOKENS.textDim, fontFamily: TOKENS.fontMono,
          letterSpacing: '0.15em' }}>
          {lang === 'jp' ? 'VLAN ポートマトリクス · ' : 'VLAN PORT MATRIX · '}8
        </div>
        <span style={{ fontSize: 10.5, color: TOKENS.textFaint, fontStyle: 'italic' }}>
          {lang === 'jp' ? '(VID セルをダブルクリックで編集)' : '(double-click a VID to edit)'}
        </span>
        <div style={{ flex: 1 }} />
        {Object.keys(portEdits).length > 0 && (
          <>
            <span style={{ fontSize: 11, color: TOKENS.indigo, fontFamily: TOKENS.fontMono }}>
              {Object.keys(portEdits).length} {lang === 'jp' ? '件の変更' : 'pending'}
            </span>
            <button onClick={() => setPortEdits({})}
              style={{ height: 22, padding: '0 8px', fontSize: 10.5, color: TOKENS.textMid,
                background: TOKENS.surface, border: `1px solid ${TOKENS.line}`, borderRadius: 4, cursor: 'pointer' }}>
              {lang === 'jp' ? 'リセット' : 'Reset'}
            </button>
          </>
        )}
      </div>
      <div style={{ border: `1px solid ${TOKENS.line}`, borderRadius: 6, overflow: 'hidden',
        background: TOKENS.bg2 }}>
        <div style={{ display: 'grid', gridTemplateColumns: '60px 160px 80px 100px 1fr 60px',
          padding: '8px 14px', fontSize: 9.5, color: TOKENS.textDim,
          fontFamily: TOKENS.fontMono, letterSpacing: '0.12em', fontWeight: 500,
          background: TOKENS.surface, borderBottom: `1px solid ${TOKENS.line}` }}>
          <span>SWITCH</span><span>PORT</span><span>VID</span><span>KIND</span><span>FLAGS</span><span></span>
        </div>
        {['sw1', 'sw2'].map(nsId => (
          <React.Fragment key={nsId}>
            {portMap[nsId].map((entry, i) => (
              <Row key={`${nsId}-${i}`} nsId={nsId} entry={entry} />
            ))}
          </React.Fragment>
        ))}
      </div>
    </div>
  );
}

          padding: 10, fontFamily: TOKENS.fontMono, fontSize: 11, lineHeight: 1.8 }}>
          <div><span style={{ color: TOKENS.textDim }}>name</span> <span style={{ color: TOKENS.text }}>veth-{node.name}</span></div>
          <div><span style={{ color: TOKENS.textDim }}>mtu</span> <span style={{ color: TOKENS.text }}>1500</span></div>
          <div><span style={{ color: TOKENS.textDim }}>address</span> <span style={{ color: TOKENS.text }}>{node.ip}</span></div>
          <div><span style={{ color: TOKENS.textDim }}>state</span> <span style={{ color: TOKENS.green }}>UP</span></div>
        </div>
      </Section>

      <Section label="VLAN MEMBERSHIP">
        <div style={{ display: 'flex', alignItems: 'center', gap: 10,
          background: node.vlan === 10 ? TOKENS.vlan10Soft : TOKENS.vlan20Soft,
          border: `1px solid ${vlanColor(node.vlan)}40`,
          padding: '10px 12px', borderRadius: 6 }}>
          <div style={{ width: 4, height: 30, background: vlanColor(node.vlan), borderRadius: 2 }} />
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 13, fontFamily: TOKENS.fontMono, color: vlanColor(node.vlan), fontWeight: 600 }}>VLAN {node.vlan}</div>
            <div style={{ fontSize: 10.5, color: TOKENS.textMid, fontFamily: TOKENS.fontMono }}>
              192.168.{node.vlan}.0/24 · {lang === 'jp' ? 'アクセス' : 'access'}
            </div>
          </div>
        </div>
      </Section>

      <Section label={lang === 'jp' ? '接続先' : 'ATTACHED TO'}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '8px 10px',
          background: TOKENS.surface, border: `1px solid ${TOKENS.line}`, borderRadius: 6 }}>
          <IconStroke d={ICONS.switch} size={13} color={TOKENS.magenta} />
          <span style={{ fontSize: 12, fontFamily: TOKENS.fontMono, color: TOKENS.text }}>
            {node.vlan === 10 ? 'sw1' : 'sw2'}
          </span>
          <span style={{ color: TOKENS.textFaint, fontSize: 11 }}>›</span>
          <span style={{ fontSize: 11, fontFamily: TOKENS.fontMono, color: TOKENS.textMid }}>
            {node.vlan === 10 ? `veth-sw1-p${node.id === 'pc1' ? 1 : 2}` : `veth-sw2-p${node.id === 'pc3' ? 1 : 2}`}
          </span>
        </div>
      </Section>

      <InspectorFooter />
    </div>
  );
}

function Section({ label, children }) {
  return (
    <div style={{ padding: '0 14px 14px' }}>
      <div style={{ fontSize: 9.5, color: TOKENS.textDim, fontFamily: TOKENS.fontMono,
        letterSpacing: '0.18em', fontWeight: 500, marginBottom: 8 }}>{label}</div>
      {children}
    </div>
  );
}

function KV({ k, v, mono }) {
  return (
    <div style={{ display: 'flex', justifyContent: 'space-between', padding: '5px 0',
      fontSize: 11.5, fontFamily: mono ? TOKENS.fontMono : TOKENS.fontSans,
      borderBottom: `1px solid ${TOKENS.lineSoft}` }}>
      <span style={{ color: TOKENS.textDim }}>{k}</span>
      <span style={{ color: TOKENS.text }}>{v}</span>
    </div>
  );
}

function InspectorFooter() {
  const { lang } = useRail();
  return (
    <div style={{ padding: '10px 14px', borderTop: `1px solid ${TOKENS.line}`,
      display: 'flex', gap: 6, background: TOKENS.bg2, position: 'sticky', bottom: 0 }}>
      <button style={{ flex: 1, height: 28, fontSize: 11, color: TOKENS.textMid,
        background: TOKENS.surface, border: `1px solid ${TOKENS.line}`, borderRadius: 5,
        cursor: 'pointer', display: 'inline-flex', alignItems: 'center',
        justifyContent: 'center', gap: 5 }}>
        <IconStroke d={ICONS.terminal} size={11} /> {lang === 'jp' ? 'シェル' : 'Shell'}
      </button>
      <button style={{ flex: 1, height: 28, fontSize: 11, color: TOKENS.textMid,
        background: TOKENS.surface, border: `1px solid ${TOKENS.line}`, borderRadius: 5,
        cursor: 'pointer', display: 'inline-flex', alignItems: 'center',
        justifyContent: 'center', gap: 5 }}>
        <IconStroke d={ICONS.eye} size={11} /> {lang === 'jp' ? 'ログ' : 'Logs'}
      </button>
    </div>
  );
}

// ─── Command palette (⌘K) ───────────────────────────────────────────────

function CommandPalette({ open, onClose }) {
  const { lang, setSelected, setView } = useRail();
  const [q, setQ] = React.useState('');
  const [activeIdx, setActiveIdx] = React.useState(0);
  const inputRef = React.useRef(null);

  React.useEffect(() => {
    if (open) { setQ(''); setActiveIdx(0); setTimeout(() => inputRef.current?.focus(), 40); }
  }, [open]);

  const allCommands = [
    { section: lang === 'jp' ? 'ノードへ移動' : 'Jump to node', items: CH01.namespaces.map(n => ({
      icon: n.role === 'switch' ? ICONS.switch : ICONS.host,
      label: n.name,
      hint: n.role === 'switch' ? 'L2 switch' : n.ip,
      color: n.role === 'switch' ? TOKENS.magenta : vlanColor(n.vlan),
      run: () => { setSelected(n.id); setView('canvas'); },
    })) },
    { section: lang === 'jp' ? 'ビュー切替' : 'Switch view', items: [
      { icon: ICONS.grid, label: lang === 'jp' ? 'キャンバス表示' : 'Canvas view', hint: '⌘1', run: () => setView('canvas') },
      { icon: ICONS.list, label: lang === 'jp' ? 'リスト表示' : 'List view', hint: '⌘2', run: () => setView('list') },
      { icon: ICONS.table, label: lang === 'jp' ? 'テーブル表示' : 'Table view', hint: '⌘3', run: () => setView('table') },
    ]},
    { section: lang === 'jp' ? 'アクション' : 'Actions', items: [
      { icon: ICONS.plus, label: lang === 'jp' ? '名前空間を追加…' : 'Add namespace…', hint: '⌘N' },
      { icon: ICONS.bridge, label: lang === 'jp' ? 'ブリッジを追加…' : 'Add bridge…' },
      { icon: ICONS.link, label: lang === 'jp' ? 'veth ペアを作成…' : 'Create veth pair…' },
      { icon: ICONS.vlan, label: lang === 'jp' ? 'VLAN を設定…' : 'Configure VLAN…' },
      { icon: ICONS.bolt, label: lang === 'jp' ? 'ping を実行' : 'Run ping' },
      { icon: ICONS.terminal, label: lang === 'jp' ? 'ターミナルを開く' : 'Open terminal', hint: '⌃`' },
    ]},
  ];

  const flat = allCommands.flatMap(s => s.items.map(i => ({ ...i, section: s.section })))
    .filter(i => !q || (i.label + ' ' + (i.hint||'')).toLowerCase().includes(q.toLowerCase()));

  React.useEffect(() => {
    if (!open) return;
    const h = (e) => {
      if (e.key === 'Escape') onClose();
      else if (e.key === 'ArrowDown') { setActiveIdx(i => Math.min(flat.length - 1, i + 1)); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { setActiveIdx(i => Math.max(0, i - 1)); e.preventDefault(); }
      else if (e.key === 'Enter') { flat[activeIdx]?.run?.(); onClose(); }
    };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, [open, activeIdx, flat.length]);

  if (!open) return null;

  let lastSection = null;

  return (
    <div onClick={onClose} style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.55)',
      zIndex: 200, display: 'flex', alignItems: 'flex-start', justifyContent: 'center', paddingTop: '14vh',
      backdropFilter: 'blur(4px)' }}>
      <div onClick={e => e.stopPropagation()} style={{ width: 560,
        background: TOKENS.surface, border: `1px solid ${TOKENS.line}`, borderRadius: 10,
        overflow: 'hidden', boxShadow: '0 25px 70px rgba(0,0,0,0.6)' }}>
        <div style={{ padding: '14px 16px', borderBottom: `1px solid ${TOKENS.line}`,
          display: 'flex', alignItems: 'center', gap: 10 }}>
          <IconStroke d={ICONS.search} size={14} color={TOKENS.textDim} />
          <input ref={inputRef} value={q} onChange={e => { setQ(e.target.value); setActiveIdx(0); }}
            placeholder={lang === 'jp' ? 'コマンドを実行… ノード名、VLAN、IP で検索' : 'Run a command… search nodes, VLANs, IPs'}
            style={{ flex: 1, background: 'transparent', border: 'none', outline: 'none',
              color: TOKENS.text, fontSize: 14, fontFamily: TOKENS.fontSans }} />
          <span style={{ fontFamily: TOKENS.fontMono, fontSize: 10, color: TOKENS.textFaint,
            border: `1px solid ${TOKENS.line}`, padding: '1px 5px', borderRadius: 3 }}>ESC</span>
        </div>
        <div style={{ maxHeight: 440, overflow: 'auto', padding: 6 }}>
          {flat.length === 0 && (
            <div style={{ padding: 30, textAlign: 'center', color: TOKENS.textFaint, fontSize: 12 }}>
              {lang === 'jp' ? '一致するコマンドがありません' : 'No matching commands'}
            </div>
          )}
          {flat.map((it, i) => {
            const showSection = it.section !== lastSection;
            lastSection = it.section;
            return (
              <React.Fragment key={i}>
                {showSection && (
                  <div style={{ padding: '10px 12px 4px', fontSize: 9.5, color: TOKENS.textDim,
                    fontFamily: TOKENS.fontMono, letterSpacing: '0.15em', fontWeight: 500 }}>
                    {it.section.toUpperCase()}
                  </div>
                )}
                <div onMouseEnter={() => setActiveIdx(i)}
                  onClick={() => { it.run?.(); onClose(); }}
                  style={{ display: 'flex', alignItems: 'center', gap: 10,
                    padding: '8px 12px', borderRadius: 6, cursor: 'pointer',
                    background: activeIdx === i ? TOKENS.surfaceHi : 'transparent' }}>
                  <IconStroke d={it.icon} size={13} color={it.color || TOKENS.textMid} />
                  <span style={{ flex: 1, fontSize: 13, color: TOKENS.text }}>{it.label}</span>
                  {it.hint && <span style={{ fontSize: 10.5, fontFamily: TOKENS.fontMono, color: TOKENS.textFaint }}>{it.hint}</span>}
                </div>
              </React.Fragment>
            );
          })}
        </div>
        <div style={{ padding: '8px 12px', borderTop: `1px solid ${TOKENS.line}`,
          display: 'flex', alignItems: 'center', gap: 14, fontSize: 10.5, fontFamily: TOKENS.fontMono, color: TOKENS.textFaint }}>
          <span>↑↓ {lang === 'jp' ? '選択' : 'navigate'}</span>
          <span>↵ {lang === 'jp' ? '実行' : 'run'}</span>
          <div style={{ flex: 1 }} />
          <span>{flat.length} {lang === 'jp' ? '件' : 'results'}</span>
        </div>
      </div>
    </div>
  );
}

Object.assign(window, { Inspector, CommandPalette, Section, KV });

// B · Rail — main app shell + tweaks + edit mode protocol

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accent": "indigo",
  "showLog": true,
  "density": "cozy",
  "startView": "canvas"
}/*EDITMODE-END*/;

const ACCENTS = {
  indigo:  { primary: '#7b7ee8', soft: 'rgba(123,126,232,0.12)' },
  emerald: { primary: '#5ec08a', soft: 'rgba(94,192,138,0.14)' },
  amber:   { primary: '#e8b15e', soft: 'rgba(232,177,94,0.14)' },
  rose:    { primary: '#f15f8b', soft: 'rgba(241,95,139,0.14)' },
  sky:     { primary: '#5ea3e8', soft: 'rgba(94,163,232,0.14)' },
};

function RailApp() {
  const [tweaks, setTweaks] = React.useState(TWEAK_DEFAULTS);
  const [lang, setLang] = React.useState('en');
  const [selectedId, setSelected] = React.useState('sw1');
  const [hoverId, setHover] = React.useState(null);
  const [view, setView] = React.useState(tweaks.startView || 'canvas');
  const [showLog, setShowLog] = React.useState(tweaks.showLog !== false);
  const [paletteOpen, setPaletteOpen] = React.useState(false);
  const [portEdits, setPortEdits] = React.useState({});
  const [applyCount, setApplyCount] = React.useState(0);
  const [tweaksOpen, setTweaksOpen] = React.useState(false);
  const [editModeOn, setEditModeOn] = React.useState(false);

  // Apply accent override
  React.useEffect(() => {
    const a = ACCENTS[tweaks.accent] || ACCENTS.indigo;
    TOKENS.indigo = a.primary;
    TOKENS.indigoSoft = a.soft;
  }, [tweaks.accent]);

  const onApply = () => {
    setApplyCount(c => c + Object.keys(portEdits).length || 1);
    setPortEdits({});
  };

  // Keyboard: ⌘K opens palette, ⌘1/2/3 switch view
  React.useEffect(() => {
    const h = (e) => {
      const meta = e.metaKey || e.ctrlKey;
      if (meta && e.key === 'k') { e.preventDefault(); setPaletteOpen(v => !v); }
      if (meta && e.key === '1') { e.preventDefault(); setView('canvas'); }
      if (meta && e.key === '2') { e.preventDefault(); setView('list'); }
      if (meta && e.key === '3') { e.preventDefault(); setView('table'); }
      if (e.key === 'Escape' && !paletteOpen) setSelected(null);
    };
    window.addEventListener('keydown', h);
    return () => window.removeEventListener('keydown', h);
  }, [paletteOpen]);

  // Edit-mode protocol
  React.useEffect(() => {
    const h = (e) => {
      const d = e.data;
      if (!d || typeof d !== 'object') return;
      if (d.type === '__activate_edit_mode') { setEditModeOn(true); setTweaksOpen(true); }
      if (d.type === '__deactivate_edit_mode') { setEditModeOn(false); setTweaksOpen(false); }
    };
    window.addEventListener('message', h);
    window.parent?.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', h);
  }, []);

  const updateTweak = (key, val) => {
    setTweaks(t => {
      const next = { ...t, [key]: val };
      window.parent?.postMessage({ type: '__edit_mode_set_keys', edits: { [key]: val } }, '*');
      return next;
    });
    if (key === 'startView') setView(val);
    if (key === 'showLog') setShowLog(val);
  };

  const L = LABELS[lang];
  const ctx = { lang, L, selectedId, setSelected, hoverId, setHover,
    view, setView, showLog, setShowLog, portEdits, setPortEdits,
    applyCount, onApply };

  return (
    <RailCtx.Provider value={ctx}>
      <div data-screen-label="B · Rail workspace"
        style={{ width: '100vw', height: '100vh', background: TOKENS.bg, color: TOKENS.text,
          fontFamily: lang === 'jp' ? TOKENS.fontJp : TOKENS.fontSans,
          display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>

        <TopBar onPaletteOpen={() => setPaletteOpen(true)}
          onLangToggle={() => setLang(l => l === 'en' ? 'jp' : 'en')} />
        <SecondaryToolbar onPaletteOpen={() => setPaletteOpen(true)} />

        <div style={{ flex: 1, display: 'flex', minHeight: 0 }}>
          <LeftRail />

          <div style={{ flex: 1, display: 'flex', flexDirection: 'column', minWidth: 0 }}>
            {view === 'canvas' && <InteractiveTopology />}
            {view === 'list' && <ListView />}
            {view === 'table' && <TableView />}
          </div>

          <Inspector />
        </div>

        <CommandPalette open={paletteOpen} onClose={() => setPaletteOpen(false)} />
        {editModeOn && <TweaksPanel tweaks={tweaks} update={updateTweak} onClose={() => setTweaksOpen(false)} />}
      </div>
    </RailCtx.Provider>
  );
}

function TweaksPanel({ tweaks, update }) {
  const Row = ({ label, children }) => (
    <div style={{ padding: '10px 14px', borderBottom: `1px solid ${TOKENS.lineSoft}` }}>
      <div style={{ fontSize: 10, color: TOKENS.textDim, fontFamily: TOKENS.fontMono,
        letterSpacing: '0.1em', marginBottom: 6, textTransform: 'uppercase' }}>{label}</div>
      {children}
    </div>
  );
  const swatches = Object.entries(ACCENTS);

  return (
    <div style={{ position: 'fixed', bottom: 16, right: 16, zIndex: 150, width: 280,
      background: TOKENS.surface, border: `1px solid ${TOKENS.line}`, borderRadius: 10,
      boxShadow: '0 20px 50px rgba(0,0,0,0.6)', fontFamily: TOKENS.fontSans,
      color: TOKENS.text }}>
      <div style={{ padding: '10px 14px', borderBottom: `1px solid ${TOKENS.line}`,
        display: 'flex', alignItems: 'center', gap: 8 }}>
        <IconStroke d={ICONS.settings} size={13} color={TOKENS.textMid} />
        <span style={{ fontSize: 12, fontWeight: 600, letterSpacing: '-0.01em' }}>Tweaks</span>
      </div>

      <Row label="Accent">
        <div style={{ display: 'flex', gap: 6 }}>
          {swatches.map(([k, a]) => (
            <button key={k} onClick={() => update('accent', k)}
              style={{ width: 26, height: 26, borderRadius: 6, border: tweaks.accent === k ? `2px solid #fff` : `1px solid ${TOKENS.line}`,
                background: a.primary, cursor: 'pointer', padding: 0 }} />
          ))}
        </div>
      </Row>

      <Row label="Start view">
        {['canvas', 'list', 'table'].map(v => (
          <button key={v} onClick={() => update('startView', v)}
            style={{ padding: '4px 10px', fontSize: 11, marginRight: 4,
              background: tweaks.startView === v ? TOKENS.indigo : TOKENS.bg2,
              color: tweaks.startView === v ? '#fff' : TOKENS.textMid,
              border: `1px solid ${tweaks.startView === v ? TOKENS.indigo : TOKENS.line}`,
              borderRadius: 4, cursor: 'pointer', textTransform: 'capitalize' }}>
            {v}
          </button>
        ))}
      </Row>

      <Row label="Command log">
        <label style={{ display: 'flex', alignItems: 'center', gap: 8, cursor: 'pointer', fontSize: 12 }}>
          <input type="checkbox" checked={tweaks.showLog !== false} onChange={e => update('showLog', e.target.checked)} />
          <span>Show command log in left rail</span>
        </label>
      </Row>
    </div>
  );
}

Object.assign(window, { RailApp, TweaksPanel });


ReactDOM.createRoot(document.getElementById('root')).render(<RailApp />);

</script>
</body>
</html>
